version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mylibrary-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reactlibrarydatabase
      MYSQL_USER: mylibrary
      MYSQL_PASSWORD: mylibrary
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../Scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
